@let v = vm();
@let t = tr();
<header class="site-header">
  <button class="home-btn" (click)="call(v?.goHome, $event)" [attr.aria-label]="t.backToHome">
    <svg width="36" height="36" viewBox="0 0 1000 1000" aria-hidden="true">
      <g fill="#F2EEE6">
        <path d="M464.27 220.05A300 300 0 1 0 748.73 630.95A250 250 0 1 1 464.27 220.05Z"></path>
        <path
          d="M720 190C727 268 742 283 820 290C742 297 727 312 720 390C713 312 698 297 620 290C698 283 713 268 720 190Z"
        ></path>
      </g>
    </svg>
    @if (v?.showWordmark) {
      <span class="wordmark">NightSky</span>
    }
  </button>
  <div class="header-actions">
    <a
      class="lang-link"
      [attr.href]="t.it"
      (click)="call(v?.switchLang, $event)"
      [attr.hreflang]="t.it2"
      [attr.lang]="t.it2"
      [attr.aria-label]="t.versioneItaliana"
      >{{ t.it3 }}</a
    ><button
      class="audio-btn"
      (click)="call(v?.toggleAudio, $event)"
      [attr.aria-pressed]="v?.audioOn"
      [attr.aria-label]="v?.audioAria"
    >
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <path
          d="M3 8h3l4-3v10l-4-3H3z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linejoin="round"
        ></path>
        <path
          [attr.d]="v?.audioWave"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
        ></path>
      </svg></button
    ><button
      class="shortcuts-btn"
      type="button"
      (click)="openShortcuts()"
      aria-haspopup="dialog"
      [attr.aria-label]="t.keyboardShortcuts"
      [attr.title]="t.keyboardShortcuts + ' (?)'"
    >
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <rect
          x="2"
          y="5"
          width="18"
          height="12"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
        ></rect>
        <path
          d="M5.5 8.5h1M9 8.5h1M12.5 8.5h1M16 8.5h.5M5.5 11h1M9 11h1M12.5 11h1M16 11h.5M7.5 14h7"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
        ></path>
      </svg></button
    ><button class="list-toggle" (click)="call(v?.toggleList, $event)" [attr.aria-pressed]="v?.listOn">
      {{ txt(v?.listLabel) }}<span class="key-hint">{{ txt(v?.listKey) }}</span>
    </button>
  </div>
</header>
