@let v = vm();
@let t = tr();
<div
  class="intro"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="t.introLabel"
  [style.--background]="txt(v?.introBg)"
>
  <div
    class="intro-logo"
    [style.--opacity]="txt(v?.introContentOp)"
    [style.--transform]="txt(v?.introContentTf)"
  >
    <svg width="132" height="132" viewBox="0 0 1000 1000" aria-hidden="true">
      <g fill="#F2EEE6" fill-opacity="0" stroke="#F2EEE6" stroke-width="7" stroke-linejoin="round">
        <path
          class="logo-stroke-1"
          pathLength="1"
          d="M464.27 220.05A300 300 0 1 0 748.73 630.95A250 250 0 1 1 464.27 220.05Z"
        ></path>
        <path
          class="logo-stroke-2"
          pathLength="1"
          d="M720 190C727 268 742 283 820 290C742 297 727 312 720 390C713 312 698 297 620 290C698 283 713 268 720 190Z"
        ></path>
      </g>
    </svg>
    <div class="boot-log" aria-hidden="true">
      <span class="boot-line"
        ><span>{{ t.systems }}</span
        ><span class="boot-ok">OK</span></span
      ><span class="boot-line-2"
        ><span>{{ t.routes }}</span
        ><span class="boot-ok">OK</span></span
      ><span class="boot-line-3"
        ><span>{{ t.drive }}</span
        ><span class="boot-ready">{{ t.ready }}</span></span
      >
    </div>
    <div class="launch">
      @if (v?.introReady) {
        <button
          class="launch-btn"
          (click)="call(v?.introClick, $event)"
          (pointerdown)="call(v?.introDown, $event)"
          (pointerup)="call(v?.introUp, $event)"
          (pointerleave)="call(v?.introCancel, $event)"
          (pointercancel)="call(v?.introCancel, $event)"
          (contextmenu)="call(v?.noMenu, $event)"
          [attr.aria-label]="t.launch"
        >
          <svg class="launch-ring" width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
            <circle
              cx="48"
              cy="48"
              r="44"
              fill="none"
              stroke="rgba(242,238,230,.2)"
              stroke-width="2"
            ></circle>
            <circle
              [skyRef]="v?.introRingRef"
              cx="48"
              cy="48"
              r="44"
              fill="none"
              stroke="#7FE6F2"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-dasharray="276.5"
              stroke-dashoffset="276.5"
              transform="rotate(-90 48 48)"
            ></circle></svg
          ><span class="launch-core" aria-hidden="true"></span></button
        ><span class="launch-hint" aria-hidden="true">{{ txt(v?.introHint) }}</span>
      }
    </div>
  </div>
  @if (v?.showSkip) {
    <button class="skip-btn" (click)="call(v?.skipIntro, $event)">
      {{ t.skipIntro }}
    </button>
  }
</div>
