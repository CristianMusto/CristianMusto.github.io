<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>NightSky</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b0a1f;
      }
    </style>
    <script>
      // "Back to the case study" from the design system: return to the exact page it was opened from.
      (function () {
        var target = null;
        var lang = 'en';
        try {
          target = sessionStorage.getItem('nightsky.dsReturn');
          if (localStorage.getItem('nightsky.lang') === 'it') lang = 'it';
        } catch (e) {}
        // Only same-site paths; otherwise the case study in the last language used.
        if (!target || target.charAt(0) !== '/' || target.charAt(1) === '/')
          target = '/' + lang + '/lab/nightsky-design';
        location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
